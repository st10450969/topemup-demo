<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TopemUp: tap-through demo</title>
<style>
:root{--bg:#070B12;--panel:#0E1626;--line:rgba(255,255,255,.12);--text:#F4F7FB;--muted:#A3B5D1;--blue:#0D6EFD;--cyan:#0DCAF0;--green:#2FD6A0;--yellow:#FFC107;--red:#FF5C6C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',Carlito,Calibri,Arial,sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(600px 320px at 85% -5%,rgba(13,110,253,.30),transparent 70%),radial-gradient(500px 300px at 0% 80%,rgba(13,202,240,.10),transparent 70%),var(--bg)}
#app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0D6EFD,#0DCAF0);display:grid;place-items:center}
.logo small{font-weight:400;font-size:10px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;margin-left:2px}
#count{font-size:12px;letter-spacing:1.6px;color:var(--muted)}#count b{color:var(--cyan)}
.cap{padding:0 2px 10px;min-height:92px}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid}
.chip.d{color:#6EA8FE;border-color:rgba(110,168,253,.55);background:rgba(13,110,253,.16)}
.chip.m{color:var(--cyan);border-color:rgba(13,202,240,.55);background:rgba(13,202,240,.12)}
.chip.a{color:var(--green);border-color:rgba(47,214,160,.55);background:rgba(47,214,160,.12)}
.chip.i{color:var(--muted);border-color:var(--line)}
.cap h2{font-size:22px;line-height:1.15;margin:8px 0 4px}.cap p{font-size:14.5px;line-height:1.38;color:var(--muted)}
.stage{flex:1;min-height:0;position:relative;display:flex;justify-content:center}
.device{position:relative;height:100%;max-height:640px;width:100%;max-width:330px;border-radius:30px;background:#04070C;border:3px solid #2A3550;padding:7px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.screen{width:100%;height:100%;border-radius:23px;background:#f6f7f9;color:#212529;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateX(var(--dx,24px))}to{opacity:1;transform:none}}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 4px}
nav button{width:58px;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:#fff;font-size:24px;cursor:pointer}
nav button.go{background:linear-gradient(135deg,#0D6EFD,#0DCAF0);border:0}
nav button:disabled{opacity:.3}
.dots{display:flex;gap:4px;justify-content:center;max-width:230px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer}.dots i.on{background:var(--cyan);width:15px;border-radius:5px}
/* mock app */
.nv{height:44px;background:#fff;border-bottom:3px solid #0d6efd;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:15px}
.nv b{color:#0d6efd}.nv i{font-style:normal;color:#6c757d;font-size:11px}
.pad{padding:13px;overflow:hidden}
.h{font-size:17px;font-weight:700;margin-bottom:9px}
.card{background:#fff;border-radius:11px;box-shadow:0 1px 5px rgba(16,24,40,.13);padding:13px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:#6c757d;font-size:11.5px;line-height:1.35}
.bdg{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;padding:2px 9px;border-radius:12px;background:#198754}.bdg.y{background:#ffc107;color:#212529}.bdg.b{background:#0d6efd}.bdg.r{background:#dc3545}.bdg.g{background:#6c757d}
.btn{display:block;width:100%;text-align:center;border-radius:8px;padding:11px 0;font-size:14.5px;font-weight:700;margin-top:9px;border:1.5px solid #0d6efd;color:#0d6efd;background:#fff;font-family:inherit;cursor:default}
.btn.p{background:#0d6efd;color:#fff}.btn.r{border-color:#dc3545;color:#dc3545}
.fld{margin-bottom:9px}.fld label{display:block;font-size:11px;color:#495057;font-weight:700;margin-bottom:3px}
.inp{border:1px solid #ced4da;background:#fff;border-radius:7px;padding:9px 10px;font-size:13.5px;color:#212529;min-height:37px}
.st{display:flex;text-align:center}.st div{flex:1}.st b{display:block;font-size:16px}.st span{font-size:10px;color:#6c757d}
.bar{height:9px;background:#e9ecef;border-radius:6px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:#198754}
.al{border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.35;margin:9px 0}.al.r{background:#f8d7da;color:#842029}.al.y{background:#fff3cd;color:#664d03}.al.g{background:#d1e7dd;color:#0f5132}
.tile{width:72px;height:72px;border-radius:9px;background:linear-gradient(135deg,#6ea8fe,#0d6efd);color:#fff;font-size:10px;display:grid;place-items:center;text-align:center}
.sum{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid #eee}.sum b{text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:9px}.tabs span{flex:1;text-align:center;font-size:12px;font-weight:700;padding:7px 0;border-radius:18px;background:#e9ecef;color:#495057}.tabs .on{background:#0d6efd;color:#fff}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tg .card{margin:0;text-align:center;padding:11px 6px}.tg .card span{font-size:10.5px;color:#6c757d;display:block}.tg .card b{font-size:22px;color:#0d6efd}
.toast{position:absolute;left:10px;right:10px;top:50px;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.3;box-shadow:0 8px 22px rgba(0,0,0,.35);background:#ffc107;color:#212529;z-index:5}.toast b{display:block;font-size:13.5px}
.big{font-size:44px;text-align:center}
.hl{position:relative;cursor:pointer}
.hl::after{content:"";position:absolute;inset:-5px;border-radius:12px;border:3px solid #0DCAF0;box-shadow:0 0 0 0 rgba(13,202,240,.7);animation:pulse 1.5s infinite;pointer-events:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(13,202,240,.65)}70%{box-shadow:0 0 0 13px rgba(13,202,240,0)}100%{box-shadow:0 0 0 0 rgba(13,202,240,0)}}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:#6c757d;pointer-events:none}
.end{background:linear-gradient(180deg,#0E1626,#070B12);color:#fff;height:100%;display:flex;flex-direction:column;justify-content:center;padding:22px;text-align:center}
.end h3{font-size:26px;margin:10px 0 6px}.end p{color:#A3B5D1;font-size:13.5px;line-height:1.4;margin-top:6px}
.end .btn{background:#0d6efd;border:0;color:#fff;margin-top:16px}
</style></head><body>
<div id="app">
 <header><div class="logo"><div class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h14M8 7h4M15 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg></div>TopemUp <small>Demo tour</small></div><div id="count"></div></header>
 <div class="cap" id="cap"></div>
 <div class="stage"><div class="device"><div class="screen" id="screen"></div></div></div>
 <nav><button id="prev" aria-label="Previous">&larr;</button><div class="dots" id="dots"></div><button id="next" class="go" aria-label="Next">&rarr;</button></nav>
</div>
<script>
/* Each slide: role (d=driver, m=manager, a=admin, i=intro), title, text, html (the screen). Wrap the thing to tap in <div class="hl" data-next>. */
var NV = function(r){return '<div class="nv"><b>TopemUp</b><i>'+r+'</i></div>'};
var S = [
{r:'i',tag:'Welcome',t:'Tap through TopemUp',x:'A 2-minute tour of the real workflow, from the driver\'s phone to the manager\'s dashboard. Use the arrows, swipe, or tap the glowing buttons.',
 h:'<div class="end"><div class="big">&#9981;</div><h3>Every litre, on record.</h3><p>Follow one diesel delivery from start to finish.</p><div class="btn hl" data-next>Start the tour</div></div>'},
{r:'d',tag:'Driver',t:'Log in',x:'Every user logs in. The system sends each role to its own home page.',
 h:NV('')+'<div class="pad"><div class="h">Log in</div><div class="card"><div class="fld"><label>Email</label><div class="inp">driver1@topemup.local</div></div><div class="fld"><label>Password</label><div class="inp">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</div></div><div class="btn p hl" data-next>Log in</div></div></div>'},
{r:'d',tag:'Driver',t:'Nothing starts without a session',x:'Deliveries are only recorded inside a session, so the litres always add up.',
 h:NV('Dashboard &nbsp; My deliveries')+'<div class="pad"><div class="h">Welcome, Test Driver</div><div class="card"><div class="h" style="font-size:15px;margin:0 0 3px">No active session</div><div class="mut">Start a session when you load at the depot.</div><div class="btn p hl" data-next>Start delivery session</div></div></div>'},
{r:'d',tag:'Driver',t:'Pick your tanker',x:'Choose from the fleet register and read the meter. Litres above the tanker\'s capacity are refused.',
 h:NV('Start session')+'<div class="pad"><div class="fld"><label>Vehicle</label><div class="inp">CA 555 001 &middot; Isuzu FTR &middot; 8,000 L</div></div><div class="fld"><label>Number of trucks to service</label><div class="inp">3</div></div><div class="fld"><label>Starting litres</label><div class="inp">3,000</div></div><div class="fld"><label>Starting meter reading</label><div class="inp">10,000</div></div><div class="btn p hl" data-next>Start session</div></div>'},
{r:'d',tag:'Driver',t:'Your live session',x:'Remaining litres are calculated for you: starting litres minus everything delivered.',
 h:NV('Dashboard &nbsp; My deliveries')+'<div class="pad"><div class="card"><div class="row"><b style="font-size:15px">Session #12</b><span class="bdg">Active</span></div><div class="mut" style="margin:3px 0 9px">Vehicle <b>CA 555 001</b> &middot; Meter at start <b>10,000.00</b></div><div class="st"><div><b>3</b><span>Trucks</span></div><div><b>3,000.00</b><span>Starting L</span></div><div><b>3,000.00</b><span>Remaining L</span></div></div><div class="bar"><i style="width:100%"></i></div></div><div class="btn p hl" data-next>Record delivery</div><div class="btn">My deliveries</div><div class="btn r">End session</div></div>'},
{r:'d',tag:'Driver',t:'Too much? It says no.',x:'Say 2,800 L has already gone out and the driver tries 800 L more. The server refuses anything above what is left.',
 h:NV('Record delivery')+'<div class="pad"><div class="fld"><label>Truck registration</label><div class="inp">CA 123 456</div></div><div class="fld"><label>Customer</label><div class="inp">Acme Mining</div></div><div class="fld"><label>Litres delivered</label><div class="inp" style="border-color:#dc3545">800</div></div><div class="al r">Only 200 litres remaining in this session.</div><div class="btn p hl" data-next>Change to 200 and continue</div></div>'},
{r:'d',tag:'Driver',t:'Photos as proof',x:'Only real JPG or PNG photos up to 5 MB are accepted. The file type is checked, not just the name.',
 h:NV('Add photos')+'<div class="pad"><div class="row" style="justify-content:flex-start;gap:9px"><div class="tile">Photo 1<br>&#10003;</div><div class="tile">Photo 2<br>&#10003;</div></div><div class="al r" style="margin-top:12px">report.pdf: only JPG or PNG photos are allowed.</div><div class="btn p hl" data-next>Next</div></div>'},
{r:'d',tag:'Driver',t:'Review, then submit',x:'Nothing is sent until you press Submit. If the signal drops, your draft is kept and a retry never makes a duplicate.',
 h:NV('Review')+'<div class="pad"><div class="card"><div class="sum"><span>Truck</span><b>CA 123 456</b></div><div class="sum"><span>Customer</span><b>Acme Mining</b></div><div class="sum"><span>Litres</span><b>200.00</b></div><div class="sum"><span>Photos</span><b>2</b></div><div class="sum" style="border:0"><span>Remaining after</span><b>0.00 L</b></div></div><div class="btn p hl" data-next>Submit delivery</div></div>'},
{r:'d',tag:'Driver',t:'Saved with a reference',x:'The driver gets a confirmation straight away, with no paperwork to hand in later.',
 h:NV('')+'<div class="pad" style="text-align:center"><div class="big" style="color:#198754;margin-top:14px">&#10003;</div><div class="h">Delivery saved</div><div class="card" style="text-align:left"><div class="sum"><span>Reference</span><b>#14</b></div><div class="sum"><span>Litres</span><b>200.00</b></div><div class="sum" style="border:0"><span>Photos</span><b>2</b></div></div><div class="btn p hl" data-next>Back to dashboard</div></div>'},
{r:'d',tag:'Driver',t:'End the session: the meter check',x:'Say the meter reads 11,620 when the session ends. That is 620 L out of the tank, but only 600 L was recorded.',
 h:NV('End session')+'<div class="pad"><div class="card"><div class="sum"><span>Recorded in deliveries</span><b>600.00 L</b></div><div class="fld" style="margin:9px 0 0"><label>Ending meter reading</label><div class="inp">11,620</div></div></div><div class="al y"><b>The meter shows 620.00 L.</b> You recorded 600.00 L. Difference 20.00 L (3.23%). This session will be flagged for review.</div><div class="btn r hl" data-next>End session</div></div>'},
{r:'d',tag:'Driver',t:'Flagged for review',x:'The server works out the difference. A difference over 2% in either direction is flagged, and a person looks at it.',
 h:NV('Session result')+'<div class="pad"><div class="card" style="text-align:center"><span class="bdg y" style="font-size:12px">Flagged for review</span><div class="st" style="margin-top:13px"><div><b>620.00</b><span>Meter L</span></div><div><b>600.00</b><span>Recorded L</span></div><div><b style="color:#d39e00">20.00</b><span>Difference L</span></div></div><div class="mut" style="margin-top:9px">3.23% is above the 2% tolerance.</div></div><div class="btn p hl" data-next>See the manager&rsquo;s side</div></div>'},
{r:'m',tag:'Manager',t:'Alerts arrive live',x:'The manager sees a pop-up the moment the session ends, plus live figures. No refresh needed.',
 h:NV('Dashboard')+'<div class="toast"><b>Fuel variance flagged</b>Session 12: 20.00 L (3.2%) &nbsp;<u><span class="hl" data-next style="font-weight:700">Review now</span></u></div><div class="pad" style="padding-top:66px"><div class="tg"><div class="card"><span>Active sessions</span><b>0</b></div><div class="card"><span>Deliveries today</span><b>15</b></div><div class="card"><span>Litres today</span><b>7,750</b></div><div class="card" style="border:2px solid #ffc107"><span>Variances to review</span><b style="color:#d39e00">1</b></div></div></div>'},
{r:'m',tag:'Manager',t:'The fuel variance list',x:'Pending, reviewed or all. The count also shows as a red badge in the menu.',
 h:NV('Fuel variance <span style="background:#dc3545;color:#fff;border-radius:9px;padding:0 6px;font-size:10px;font-style:normal">1</span>')+'<div class="pad"><div class="tabs"><span class="on">Pending</span><span>Reviewed</span><span>All</span></div><div class="card"><div class="row"><b>Session #12</b><span class="bdg y">Flagged</span></div><div class="mut" style="margin:3px 0 8px">Test Driver &middot; CA 555 001</div><div class="st"><div><b>620.00</b><span>Meter L</span></div><div><b>600.00</b><span>Recorded L</span></div><div><b style="color:#d39e00">3.23%</b><span>Difference</span></div></div><div class="btn p hl" data-next>Review</div></div></div>'},
{r:'m',tag:'Manager',t:'Write down what you found',x:'A note of 5 to 500 characters is required. The reviewer, the time and the note are kept, and a session can be reviewed once.',
 h:NV('Review session #12')+'<div class="pad"><div class="card"><div class="fld"><label>Review note</label><div class="inp" style="min-height:96px;line-height:1.4">Checked with the driver. Hose flushed at the depot after loading. Logged and agreed.</div><div class="mut" style="text-align:right;margin-top:3px">82 / 500</div></div><div class="btn p hl" data-next>Save review</div></div></div>'},
{r:'m',tag:'Manager',t:'History, photos and Excel',x:'Sort, filter and search every delivery, open the photos, and download a report for any date range.',
 h:NV('Delivery history')+'<div class="pad"><div class="card"><div class="row"><b>Acme Mining</b><span class="mut">200.00 L</span></div><div class="mut">CA 123 456 &middot; Test Driver</div><div class="row" style="justify-content:flex-start;gap:6px;margin-top:8px"><div class="tile" style="width:46px;height:46px;font-size:8px">Photo</div><div class="tile" style="width:46px;height:46px;font-size:8px">Photo</div></div></div><div class="card"><div class="row"><b>Delta Haulage</b><span class="mut">190.00 L</span></div><div class="mut">CA 101 201 &middot; Test Driver</div></div><div class="btn p hl" data-next>Download Excel report</div></div>'},
{r:'a',tag:'Administrator',t:'Control and accountability',x:'Administrators manage users and roles, and every login, delivery, change and review is traced in the audit log.',
 h:NV('Admin')+'<div class="pad"><div class="card"><div class="row"><span>driver1@topemup.local</span><span class="bdg b">Driver</span></div><div class="row" style="margin-top:8px"><span>manager1@topemup.local</span><span class="bdg" style="background:#0dcaf0;color:#212529">Manager</span></div></div><div class="h" style="font-size:14px">Audit log</div><div class="card" style="padding:9px 12px"><div class="sum"><span>Variance Reviewed</span><b>manager1</b></div><div class="sum"><span>Fuel Variance Flagged</span><b>driver1</b></div><div class="sum" style="border:0"><span>Session Ended</span><b>driver1</b></div></div><div class="btn p hl" data-next>Finish</div></div>'},
{r:'i',tag:'Thank you',t:'That is TopemUp',x:'Records every delivery, checks every litre, shows managers the field live.',
 h:'<div class="end"><div class="big">&#10004;&#65039;</div><h3>Every litre, on record.</h3><p>Built by MNM Solutions<br>Muhammad Salujee &middot; Muawiyah Suleman &middot; Neha Singh<br>INSY7315</p><div class="btn hl" data-restart>Replay the tour</div></div>'}
];
var i = 0, dir = 1, $ = function(id){return document.getElementById(id)};
function render(){
  var s = S[i];
  $('count').innerHTML = '<b>'+(i+1)+'</b> / '+S.length;
  $('cap').innerHTML = '<span class="chip '+s.r+'">'+s.tag+'</span><h2>'+s.t+'</h2><p>'+s.x+'</p>';
  var sc = $('screen'); sc.style.setProperty('--dx', (dir*24)+'px');
  sc.innerHTML = '<div class="slide">'+s.h+'</div>';
  $('prev').disabled = i === 0; $('next').disabled = i === S.length-1;
  $('dots').innerHTML = S.map(function(_, k){return '<i class="'+(k===i?'on':'')+'" data-k="'+k+'"></i>'}).join('');
  if (history.replaceState) history.replaceState(null, '', '#'+(i+1));
}
function go(n){ if(n<0||n>=S.length) return; dir = n>=i?1:-1; i=n; render(); }
$('next').onclick=function(){go(i+1)}; $('prev').onclick=function(){go(i-1)};
$('dots').onclick=function(e){ if(e.target.dataset.k) go(+e.target.dataset.k) };
$('screen').onclick=function(e){ var t=e.target.closest('.hl'); if(!t) return; if(t.hasAttribute('data-restart')) go(0); else go(i+1) };
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') go(i+1); if(e.key==='ArrowLeft') go(i-1) });
var x0=null; document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>50) go(dx<0?i+1:i-1) },{passive:true});
var h = parseInt(location.hash.slice(1),10); if(h>=1 && h<=S.length) i=h-1;
render();
</script></body></html>
